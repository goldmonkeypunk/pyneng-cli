name: Universal quality checks

on:
  push:
    branches: ["main", "ci-setup"]   # добавьте, если хотите прогонять CI по этой ветке
  pull_request:
    branches: ["main"]

env:
  PROJECT_PATH: "src"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy pytest pytest-cov build sphinx

      - name: ✨ Ruff
        run: ruff check $PROJECT_PATH

      - name: 🖤 Black
        run: black --check .

      - name: 🔍 MyPy
        run: mypy $PROJECT_PATH

      - name: 🧪 PyTest
        run: pytest -q
