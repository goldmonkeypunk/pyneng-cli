# 🚦 Автоматичні перевірки коду, тестування та збірка
name: 🚦 Універсальні перевірки якості

on:
  push: 
    branches: ["main", "ci-setup"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '12 0  * * *'
    - cron: '12 2  * * *'
    - cron: '12 4  * * *'
    - cron: '12 6  * * *'
    - cron: '12 8  * * *'
    - cron: '12 10 * * *'
    - cron: '12 12 * * *'
    - cron: '12 14 * * *'
    - cron: '12 16 * * *'
    - cron: '12 18 * * *'

env:
  PYTHON_VERSION: "3.12"                     # змінити на "" для не‑Python
  PROJECT_PATH: "."                          # шлях до вихідного коду
  LINT_CMD: "ruff check $PROJECT_PATH"
  FORMAT_CMD: "black --check $PROJECT_PATH"
  TYPECHECK_CMD: "mypy $PROJECT_PATH || true"   # не завалює build
  SECURITY_CMD: "bandit -r $PROJECT_PATH -ll"
  TEST_CMD: "pytest -q --cov=$PROJECT_PATH --cov-report=xml"
  DOCS_CMD: "if [ -d docs ]; then sphinx-build -b html docs docs/_build/html; fi"
  BUILD_CMD: "python -m build --sdist --wheel -o dist"
  COV_THRESHOLD: "0"                         # піднімати, коли з'являться тести

jobs:
  quality:
    name: 🛠️ Перевірки коду
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Клон репозиторію
        uses: actions/checkout@v4

      - name: 🐍 Встановити Python
        if: env.PYTHON_VERSION != ''
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 📦 Prod‑залежності
        run: |
          python -m pip install -U pip
          pip install -e .

      - name: 🧰 Dev‑інструменти
        run: |
          pip install ruff black mypy bandit pytest pytest-cov build sphinx

      - name: 🔍 Ruff
        run: eval "$LINT_CMD"

      - name: 🎨 Black
        run: eval "$FORMAT_CMD"

      - name: 🔎 MyPy
        run: eval "$TYPECHECK_CMD"
        
      - name: 🛡️ Bandit
        run: eval "$SECURITY_CMD"

      - name: ✅ PyTest + coverage
        id: tests
        run: |
          eval "$TEST_CMD"
          COV=$(grep -oP '(?<=line-rate=")[0-9.]+' coverage.xml | awk '{printf "%.1f",$1*100}')
          echo "coverage=$COV" >> $GITHUB_OUTPUT

      - name: 📏 Контроль покриття
        run: |
          ACT=${{ steps.tests.outputs.coverage }}
          echo "Покриття: $ACT %, поріг $COV_THRESHOLD %"
          test $(printf "%.0f" $ACT) -ge $COV_THRESHOLD

      - name: 📚 Sphinx‑docs (якщо є)
        run: eval "$DOCS_CMD"

      - name: 📦 Build дистрибутива
        run: eval "$BUILD_CMD"

      - name: 📝 Підсумок
        run: |
          echo "### Підсумок якості"                           >> $GITHUB_STEP_SUMMARY
          echo "- Покриття: **${{ steps.tests.outputs.coverage }} %**" >> $GITHUB_STEP_SUMMARY
          echo "- Поріг: **$COV_THRESHOLD %**"                >> $GITHUB_STEP_SUMMARY

      - name: 💾 Артефакти
        uses: actions/upload-artifact@v4
        with:
          name: quality-artifacts
          path: |
            coverage.xml
            dist/*
            docs/_build/html
