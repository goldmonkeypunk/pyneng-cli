# 🔍 Аудит та SBOM залежностей (ручний запуск)
name: 🔍 Універсальний аудит залежностей

on:
  workflow_dispatch:
    inputs:
      UPGRADE:
        description: "Оновити залежності перед аудитом"
        type: boolean
        default: false

env:
  INSTALL_CMD: "pip install"
  AUDIT_CMD: "pip-audit -f table"
  SBOM_CMD: "pip-licenses --format=md --with-license-file"

jobs:
  audit:
    name: ☑️ Аудит залежностей
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 📦 Встановити інструменти
        run: $INSTALL_CMD pip-audit safety pip-licenses

      - name: 🔄 Оновити залежності
        if: ${{ github.event.inputs.UPGRADE == 'true' }}
        run: $INSTALL_CMD -U .

      - name: 🗒️ SBOM
        run: eval "$SBOM_CMD" > sbom.md

      - name: 🛡️ pip‑audit
        run: eval "$AUDIT_CMD" | tee audit.txt

      - name: 📊 Safety DB
        run: safety check --full-report | tee safety.txt

      - name: 📈 CVE‑статистика
        id: cve
        run: |
          COUNT=$(grep -c "CVE-" audit.txt || true)
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: 📝 Підсумок
        run: |
          echo "### Аудит залежностей"                  >> $GITHUB_STEP_SUMMARY
          echo "- Знайдено CVE: **${{ steps.cve.outputs.count }}**" >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: |
            audit.txt
            safety.txt
            sbom.md
