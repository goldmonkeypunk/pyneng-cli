###############################################################################
# PYPROJECT.TOML — конфігурація пакета «pyneng_cli»
###############################################################################

[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# --------------------------------------------------------------------------- #
#   МЕТАДАНІ ПРОЄКТУ
# --------------------------------------------------------------------------- #
[project]
name            = "pyneng_cli"
dynamic         = ["version", "description"]
authors         = [{ name = "Your Name", email = "you@example.com" }]
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.12"

dependencies = [
    "click>=8.1.7,<9.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0,<0.5.0",
    "black>=24.4.2,<25.0.0",
    "mypy>=1.10.0,<2.0.0",
    "pytest>=8.2.0,<9.0.0",
    "pytest-cov",
    "build",
    "sphinx",
]

# --------------------------------------------------------------------------- #
#   SETUPTOOLS
# --------------------------------------------------------------------------- #
[tool.setuptools.package-data]
"pyneng_cli" = ["py.typed"]

# --------------------------------------------------------------------------- #
#   BLACK
# --------------------------------------------------------------------------- #
[tool.black]
line-length    = 88
target-version = ["py312"]

# --------------------------------------------------------------------------- #
#   ISORT (вирівнюємо імпорти під Black, навіть якщо Ruff-isort вимкнено)
# --------------------------------------------------------------------------- #
[tool.isort]
profile                = "black"
line_length            = 88
multi_line_output      = 3
include_trailing_comma = true
combine_as_imports     = true
known_first_party      = ["pyneng_cli"]

# --------------------------------------------------------------------------- #
#   MYPY
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version         = "3.12"
strict                 = true
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
#   PYTEST
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
addopts   = "-q --color=yes"
testpaths = ["tests"]

# --------------------------------------------------------------------------- #
#   RUFF (версія 0.4+)
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length    = 88
target-version = "py312"

[tool.ruff.lint]
# увімкнено тільки базові категорії помилок/попереджень
select = ["E", "F"]
# ігноруємо ліміти довжини рядка
extend-ignore = ["E501"]

# --------------------------------------------------------------------------- #
#   SPHINX (опціонально)
# --------------------------------------------------------------------------- #
[tool.sphinx]
project   = "pyneng_cli"
copyright = "2025, Your Name"
author    = "Your Name"

###############################################################################
# Кінець файлу
###############################################################################
