###############################################################################
# PYPROJECT.TOML — повна конфігурація пакета «pyneng_cli»
###############################################################################

[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "pyneng_cli"
dynamic         = ["version", "description"]
authors         = [{ name = "Your Name", email = "you@example.com" }]
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.12"

dependencies = [
    # --- runtime deps ---
    "click>=8.1.7,<9.0.0",
]

[project.optional-dependencies]
dev = [
    # якісні інструменти
    "ruff>=0.4.0,<0.5.0",
    "black>=24.4.2,<25.0.0",
    "mypy>=1.10.0,<2.0.0",
    "pytest>=8.2.0,<9.0.0",
    "pytest-cov",
    "build",
    "sphinx",
]

###############################################################################
# Setuptools (автоматичний пошук пакунків з префіксом `pyneng_cli`)
###############################################################################
[tool.setuptools.package-data]
"pyneng_cli" = ["py.typed"]

###############################################################################
# Black
###############################################################################
[tool.black]
line-length    = 88
target-version = ["py312"]

###############################################################################
# isort (вирівнюємо імпорти під Black)
###############################################################################
[tool.isort]
profile                = "black"
line_length            = 88
multi_line_output      = 3
include_trailing_comma = true
combine_as_imports     = true
known_first_party      = ["pyneng_cli"]

###############################################################################
# mypy
###############################################################################
[tool.mypy]
python_version        = "3.12"
strict                = true
ignore_missing_imports = true
plugins               = []

###############################################################################
# pytest
###############################################################################
[tool.pytest.ini_options]
addopts   = "-q --color=yes"
testpaths = ["tests"]

###############################################################################
# Ruff 0.4+  (уся лінтер-конфігурація тепер у підсекції [tool.ruff.lint])
###############################################################################
[tool.ruff]
line-length    = 88
target-version = "py312"

[tool.ruff.lint]
# Увімкнені правила
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "W",  # pycodestyle warnings
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "SIM",# flake8-simplify
    "C90",# mccabe
]

# Приклад: забороняємо автофікси для певної групи (необов'язково)
extend-unfixable = ["B"]     # не виправляти Bugbear-правила

###############################################################################
# Пагінація документації (Sphinx)
###############################################################################
[tool.sphinx]
project   = "pyneng_cli"
copyright = "2025, Your Name"
author    = "Your Name"

###############################################################################
# Кінець файлу
###############################################################################
