[project]
name = "pyneng-cli"
version = "5.1.0"      # ← ставлю поточну версію пакета
description = "CLI utility for 'Python for Network Engineers'"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
  "ruff>=0.4",
  "black>=24.4",
  "mypy>=1.10",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "build>=1.2",
  "sphinx>=7.3",
  "pip-licenses>=4.4"
]
