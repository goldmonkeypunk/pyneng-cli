[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "pyneng-cli"
version         = "5.1.0"
description     = "CLI-утиліта до курсу «Пайтон для мережевих інженерів»"
readme          = "README.md"
license         = { file = "LICENSE" }
authors         = [{ name = "Natalia Samoylenko", email = "natenka@example.com" }]
requires-python = ">=3.9"

dependencies = [
  "click>=8.1,<9.0",
]

[project.optional-dependencies]
dev = [
  # лінтери / форматери
  "ruff>=0.4.4,<0.5.0",
  "black>=24.2.0,<25.0",
  # типізація
  "mypy>=1.9.0,<2.0",
  # тестування й покриття
  "pytest>=8.2.0,<9.0",
  "pytest-cov>=5,<6",
  # документація
  "sphinx>=7.2,<8.0",
]

############################################################
#                      ІНСТРУМЕНТИ                         #
############################################################

[tool.black]
line-length             = 88
target-version          = ["py311"]
skip-string-normalization = true

[tool.mypy]
python_version          = "3.11"
strict                  = true
exclude                 = ["tests/"]

[tool.ruff]
line-length   = 88
target-version = "py311"

[tool.ruff.lint]
select        = ["ALL"]          # увесь набір правил Ruff
ignore        = ["D203", "D212"] # приклад відключених Docstring-правил
fixable       = ["ALL"]          # що можна авто-фіксити
unsafe-fixes  = []               # небезпечні автофікси заборонено

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN", "S101"] # у тестах м’якше

[tool.pytest.ini_options]
addopts   = "-q --strict-markers --tb=short"
testpaths = ["tests"]
