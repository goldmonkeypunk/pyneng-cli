[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
  "ruff>=0.4",
  "black>=24.4",
  "mypy>=1.10",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "build>=1.2",
  "sphinx>=7.3",
  "pip-licenses>=4.4"
]
