###############################################################################
# PYPROJECT.TOML — конфігурація пакета «pyneng_cli»
###############################################################################

[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# --------------------------------------------------------------------------- #
#   МЕТАДАНІ ПРОЄКТУ
# --------------------------------------------------------------------------- #
[project]
name            = "pyneng_cli"
dynamic         = ["version", "description"]
authors         = [{ name = "Your Name", email = "you@example.com" }]
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.12"

dependencies = [
    "click>=8.1.7,<9.0.0",
]

[project.optional-dependencies]
dev = [
    # форматування / стиль
    "ruff>=0.4.0,<0.5.0",
    "black>=24.4.2,<25.0.0",

    # тести
    "pytest>=8.2.0,<9.0.0",
    "pytest-cov",

    # документація / білд
    "build",
    "sphinx",
]

# --------------------------------------------------------------------------- #
#   SETUPTOOLS
# --------------------------------------------------------------------------- #
[tool.setuptools.package-data]
"pyneng_cli" = ["py.typed"]

# --------------------------------------------------------------------------- #
#   BLACK
# --------------------------------------------------------------------------- #
[tool.black]
line-length    = 88
target-version = ["py312"]

# --------------------------------------------------------------------------- #
#   ISORT
# --------------------------------------------------------------------------- #
[tool.isort]
profile                = "black"
line_length            = 88
multi_line_output      = 3
include_trailing_comma = true
combine_as_imports     = true
known_first_party      = ["pyneng_cli"]

# --------------------------------------------------------------------------- #
#   MYPY  (спрощені налаштування — лише базова перевірка)
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version          = "3.12"
ignore_missing_imports  = true
disallow_untyped_defs   = false   # ДОЗВОЛЯЄМО функції без анотацій
disallow_incomplete_defs = false
warn_unused_ignores     = false   # не лаятися на зайві `type: ignore`

# --------------------------------------------------------------------------- #
#   PYTEST
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
addopts   = "-q --color=yes"
testpaths = ["tests"]

# --------------------------------------------------------------------------- #
#   RUFF
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length    = 88
target-version = "py312"

[tool.ruff.lint]
select        = ["E", "F"]   # тільки критичні помилки
extend-ignore = ["E501"]     # ігноруємо довгі рядки

# --------------------------------------------------------------------------- #
#   SPHINX (опціонально)
# --------------------------------------------------------------------------- #
[tool.sphinx]
project   = "pyneng_cli"
copyright = "2025, Your Name"
author    = "Your Name"

###############################################################################
# Кінець файлу
###############################################################################
